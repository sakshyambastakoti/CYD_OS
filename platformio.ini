; ==========================================================================
; CYD OS — PlatformIO Configuration
; Target: ESP32-2432S028R (Cheap Yellow Display)
; MCU:    ESP32-WROOM-32 (No PSRAM)
; ==========================================================================

[env:cyd_os]
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Upload
upload_speed = 921600

; Partition table — 3MB app space for large firmware
board_build.partitions = partitions.csv

; Flash mode and frequency
board_build.f_flash = 80000000L
board_build.flash_mode = dio

; Build flags
build_flags =
    -I include
    ; LVGL configuration
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_PATH=lv_conf.h
    ; Display orientation
    -D CYD_DISPLAY_WIDTH=240
    -D CYD_DISPLAY_HEIGHT=320
    ; Compiler optimizations
    -O2
    -Wall
    -Wno-unused-variable
    -Wno-unused-function

; Library dependencies (pinned versions)
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.33
    lvgl/lvgl @ ~8.3.11
    bblanchon/ArduinoJson @ ^7.0.0

; Extra include paths
build_src_flags =
    -I include

; Unit test environment
[env:test]
platform = espressif32 @ ^6.10.0
board = esp32dev
framework = arduino
test_framework = unity
board_build.partitions = partitions.csv
lib_deps =
    lovyan03/LovyanGFX @ ^1.2.33
    lvgl/lvgl @ ~8.3.11
    bblanchon/ArduinoJson @ ^7.0.0
build_flags =
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_CONF_PATH=lv_conf.h
    -D UNIT_TEST
